version: 1
# Requires the Amazon Linux 2023 build image (App settings > Build settings >
# Build image settings). The older Amazon Linux 2 image can't run Node 18+.
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v && npm -v
    build:
      commands:
        # `npm install` rather than `npm ci`: Amplify's data-construct packages
        # bundle exact versions of their own dependencies, which npm's lock
        # file can't describe, so `npm ci` rejects the lock file as out of sync.
        # `npm install` still installs the versions pinned in package-lock.json.
        - npm install --no-audit --no-fund --cache .npm --prefer-offline
        # Deploys the Cognito auth backend for this branch and writes
        # src/amplify_outputs.json for the frontend build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir src
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
